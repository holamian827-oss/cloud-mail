# 安全提示:请勿在本文件硬编码数据库ID/JWT密钥,避免随仓库泄露。
# 下面使用环境变量占位符,部署前先注入:
#   export D1_DATABASE_ID="你的D1数据库ID"
#   export JWT_SECRET="你的随机密钥"	# 也可用 wrangler secret put jwt_secret 注入(代码读取的是 c.env.jwt_secret)
name = "cloud-mail-dev"
main = "src/index.js"
compatibility_date = "2025-06-04"
keep_vars = true

[observability]
enabled = true

[dev]
ip = "0.0.0.0"

[[d1_databases]]
binding = "db"
database_name = "email"
database_id = "${D1_DATABASE_ID}"

[[kv_namespaces]]
binding = "kv"
id = "2io01d4b299e481b9de060ece9e7785c"

#[[r2_buckets]]
#binding = "r2"
#bucket_name = "email"

#[ai]
#binding = "ai"

[assets]
binding = "assets"
directory = "./dist"
not_found_handling = "single-page-application"
run_worker_first = true

#[[send_email]]
#name = "email"


[vars]
ai_model = ""
analysis_cache = false
orm_log = true
domain = ["example.com", "example2.com", "example3.com", "example4.com"]
admin = "admin@example.com"
jwt_secret = "${JWT_SECRET}"
