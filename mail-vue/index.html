<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="theme-color" content="#EEF2F8" id="theme-color-meta">
  <meta name="description" content="Cloud Mail">
  <title>Cloud Mail</title>
  <link rel="icon" href="/mail.png" type="image/png">
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  <script>
    const uiStoreStr =  localStorage.getItem('ui')
    let isDark = false
    if (uiStoreStr) {
      const uiStore =  JSON.parse(uiStoreStr)
      isDark = uiStore.dark
      const root = document.documentElement
      root.setAttribute('class', isDark ? 'dark' : '');
    }
    const metaTag = document.getElementById('theme-color-meta');
    const isMobile =  !window.matchMedia("(pointer: fine) and (hover: hover)").matches;
    metaTag.setAttribute('content', isDark ? (isMobile ? '#0A0C12' : '#000000') : (isMobile ? '#191A23' : '#EEF2F8'));
  </script>
  <style>
    /* 首屏关键样式：在应用 bundle 加载前就要生效，所以不能依赖 glass.css。
       下面的底色与色晕刻意和 glass.css 的 --glass-page-base / --glass-mesh 保持一致，
       否则应用挂载后背景会「跳」一下。改 glass.css 的调色板时记得同步这里。 */
    html {
      background: #EEF2F8;
    }
    html.dark {
      background: #0A0C12;
    }
    html::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background-repeat: no-repeat;
      background-size: cover;
      background-image:
        radial-gradient(1100px 700px at 12% -10%, rgba(24, 144, 255, 0.30), transparent 60%),
        radial-gradient(900px 620px at 94% 2%, rgba(124, 92, 255, 0.26), transparent 58%),
        radial-gradient(820px 700px at 80% 98%, rgba(34, 211, 238, 0.22), transparent 60%),
        radial-gradient(720px 560px at 20% 90%, rgba(255, 138, 196, 0.18), transparent 62%);
    }
    html.dark::before {
      background-image:
        radial-gradient(1100px 700px at 12% -10%, rgba(24, 144, 255, 0.20), transparent 60%),
        radial-gradient(900px 620px at 94% 2%, rgba(124, 92, 255, 0.18), transparent 58%),
        radial-gradient(820px 700px at 80% 98%, rgba(34, 211, 238, 0.13), transparent 60%),
        radial-gradient(720px 560px at 20% 90%, rgba(255, 138, 196, 0.10), transparent 62%);
    }

    #loading-first {
      position: fixed;
      left: 0;
      top: 0;
      height: 100%;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 500;
      background: var(--el-bg-color, transparent);
    }

    .loading-hide {
      pointer-events: none;
      opacity: 0;
    }

    .loading-icon {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
    }

    .loading-image {
      width: 70px;
      height: 70px;
      object-fit: contain;
    }

    .loading-progress {
      position: relative;
      width: 64px;
      height: 4px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(64, 158, 255, 0.18);
    }

    .loading-progress::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      border-radius: inherit;
      background: #409EFF;
      transform: scaleX(0);
      transform-origin: left center;
      animation: loading-progress-grow 2.4s linear forwards;
    }

    .loading-progress::after {
      content: "";
      position: absolute;
      top: 0;
      width: 24px;
      height: 100%;
      border-radius: inherit;
      background: rgba(64, 158, 255, 0.45);
      filter: blur(4px);
      transform: translateX(-24px);
      animation: loading-progress-peg 2.4s linear forwards;
    }

    .loading-complete .loading-progress::before {
      animation: none;
      transform: scaleX(1);
      transition: transform 200ms linear;
    }

    .loading-complete .loading-progress::after {
      animation: none;
      transform: translateX(60px);
      transition: transform 200ms linear;
    }

    @keyframes loading-progress-grow {
      0% {
        transform: scaleX(0);
      }
      100% {
        transform: scaleX(1);
      }
    }

    @keyframes loading-progress-peg {
      0% {
        transform: translateX(-24px);
      }
      100% {
        transform: translateX(60px);
      }
    }
  </style>
</head>
<body>
<div id="loading-first">
  <div class="loading-icon">
    <img class="loading-image" src="/mail-pwa.png" alt="Cloud Mail">
    <div class="loading-progress" aria-hidden="true"></div>
  </div>
</div>
<div id="app"></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
